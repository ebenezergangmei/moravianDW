name: Update Watchword file list

on:
  push:
    paths:
      - "data/*.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-file-list:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild data/files.json
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          files = sorted(
              p.name
              for p in Path("data").glob("*.txt")
              if p.is_file()
          )

          Path("data/files.json").write_text(
              json.dumps(files, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          print("Watchword files:", files)
          PY

      - name: Commit updated file list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/files.json
          if git diff --cached --quiet; then
            echo "files.json is already up to date."
          else
            git commit -m "Update Watchword TXT file list"
            git push
          fi
